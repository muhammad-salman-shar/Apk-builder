<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to APK Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .feature-list {
            list-style: none;
            margin: 20px 0;
        }
        .feature-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            color: #444;
        }
        .feature-list li:last-child {
            border-bottom: none;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .result.show {
            display: block;
        }
        code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 HTML to APK Builder</h1>
        <p class="subtitle">This is a demo app built from a single HTML file!</p>
        
        <ul class="feature-list">
            <li>✅ Single self-contained HTML file</li>
            <li>✅ Inline CSS and JavaScript</li>
            <li>✅ Native Android bridge access</li>
            <li>✅ File picker support</li>
            <li>✅ Download manager integration</li>
            <li>✅ Notifications support</li>
        </ul>
        
        <div>
            <button class="btn" onclick="testVibrate()">Test Vibration</button>
            <button class="btn btn-secondary" onclick="testToast()">Show Toast</button>
        </div>
        
        <div>
            <button class="btn" onclick="testNotification()">Send Notification</button>
            <button class="btn btn-secondary" onclick="testClipboard()">Copy to Clipboard</button>
        </div>
        
        <div>
            <input type="file" id="fileInput" style="margin: 15px 0;">
        </div>
        
        <div class="result" id="result">
            <strong>Result:</strong> <span id="resultText"></span>
        </div>
    </div>

    <script>
        function showResult(text) {
            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            resultText.textContent = text;
            resultDiv.classList.add('show');
            setTimeout(() => resultDiv.classList.remove('show'), 3000);
        }
        
        function testVibrate() {
            if (typeof Android !== 'undefined') {
                Android.vibrate(200);
                showResult('Vibrated for 200ms');
            } else {
                showResult('Android bridge not available (running in browser)');
            }
        }
        
        function testToast() {
            if (typeof Android !== 'undefined') {
                Android.toast('Hello from JavaScript!', 'short');
                showResult('Toast displayed');
            } else {
                alert('Hello from JavaScript!');
                showResult('Alert shown (browser mode)');
            }
        }
        
        function testNotification() {
            if (typeof Android !== 'undefined') {
                Android.notify(JSON.stringify({
                    title: 'Test Notification',
                    body: 'This is a test notification from your HTML app!',
                    id: Date.now()
                }));
                showResult('Notification sent');
            } else {
                showResult('Android bridge not available');
            }
        }
        
        function testClipboard() {
            if (typeof Android !== 'undefined') {
                Android.copyToClipboard('Text copied from HTML app!');
                showResult('Text copied to clipboard');
            } else {
                navigator.clipboard.writeText('Text copied from HTML app!');
                showResult('Text copied (browser mode)');
            }
        }
        
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                showResult('Selected file: ' + e.target.files[0].name);
            }
        });
        
        // Get Android version info
        if (typeof Android !== 'undefined') {
            try {
                const versionInfo = JSON.parse(Android.getAndroidVersion());
                console.log('Android SDK:', versionInfo.sdkInt);
            } catch (e) {
                console.log('Running in browser');
            }
        }
    </script>
</body>
</html>
